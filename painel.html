<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visão Cidadão — Painel</title>
<style>
  :root {
    --bg: #F4F7FB;
    --card: #FFFFFF;
    --texto: #1A1A1A;
    --texto-fraco: #6B7280;
    --borda: #E5E7EB;
    --azul: #16265E;
    --azul2: #1E4FA0;
    --azul-fraco: #E8EEFA;
    --verde: #1E9E5B;
    --verde2: #10B981;
    --verde-fraco: #E1F6EC;
    --ambar: #B45309;
    --ambar-fraco: #FDF0DC;
    --teal: #0E7C86;
    --teal-fraco: #E1F3F4;
    --raio: 14px;
    --sombra: 0 1px 2px rgba(16,38,94,.06), 0 6px 16px rgba(16,38,94,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 320px at 15% -5%, #E4EEFB 0%, transparent 60%),
      radial-gradient(900px 320px at 100% 0%, #E1F6EC 0%, transparent 55%),
      var(--bg);
    color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    background: var(--card);
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, var(--verde), var(--azul2), var(--azul)) 1;
    box-shadow: 0 2px 10px rgba(16,38,94,.06);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .marca { display: flex; align-items: center; gap: 12px; }
  .logo-slot {
    width: 44px; height: 44px; flex-shrink: 0;
    background: #fff;
    border-radius: 50%;
    box-shadow: var(--sombra);
    padding: 4px;
  }
  .logo-slot svg { display: block; width: 100%; height: 100%; }
  .wordmark-linha1 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--verde);
    margin: 0;
  }
  .wordmark-linha2 {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.3px;
    color: var(--azul);
    margin: 0;
    line-height: 1.1;
  }
  #btnSair {
    background: var(--azul-fraco);
    border: 1px solid #D6E0F5;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: var(--azul);
  }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--borda);
    border-top: 4px solid var(--cor-tema, var(--azul));
    border-radius: var(--raio);
    padding: 16px 20px;
    box-shadow: var(--sombra);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .stat-icone {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--cor-fraca, var(--azul-fraco));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .stat-card .valor { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--cor-tema, var(--texto)); }
  .stat-card .rotulo { font-size: 12px; color: var(--texto-fraco); margin-top: 2px; }

  .abas {
    display: flex;
    gap: 4px;
    background: #FFFFFF;
    border: 1px solid var(--borda);
    padding: 4px;
    border-radius: 12px;
    width: fit-content;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }
  .aba-btn {
    border: none;
    background: none;
    padding: 9px 20px;
    font-size: 14px;
    font-weight: 700;
    color: var(--texto-fraco);
    border-radius: 9px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    transition: background .15s ease, color .15s ease;
  }
  .aba-btn:hover:not(.ativa) { background: var(--bg); color: var(--azul); }
  .aba-btn.ativa {
    background: linear-gradient(135deg, var(--azul2), var(--azul));
    color: #fff;
    box-shadow: 0 4px 10px rgba(22,38,94,.25);
  }

  .secao {
    background: var(--card);
    border: 1px solid var(--borda);
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .secao-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--borda);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  #painelConversas .secao-header { background: linear-gradient(90deg, var(--azul-fraco), #fff); }
  #painelAgenda .secao-header { background: linear-gradient(90deg, var(--verde-fraco), #fff); }
  .secao-header h2 { font-size: 16px; margin: 0; color: var(--azul); }
  .secao-body { padding: 4px 20px 16px; }

  input[type="text"], input[type="password"] {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    width: 100%;
    max-width: 260px;
    font-family: inherit;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    outline: 2px solid var(--azul2);
    outline-offset: 1px;
    border-color: var(--azul2);
  }
  select {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 14px;
    width: 100%;
    font-family: inherit;
    background: #fff;
  }
  button { font-family: inherit; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,20,35,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-box {
    background: #fff;
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    animation: modal-entrar .18s ease;
  }
  @keyframes modal-entrar {
    from { opacity: 0; transform: translateY(8px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-box h3 { margin: 0 0 16px; color: var(--azul); font-size: 17px; }
  .modal-box label { display: block; font-size: 13px; font-weight: 600; color: var(--texto-fraco); margin: 12px 0 4px; }
  .modal-box .modal-botoes { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
  .btn {
    background: linear-gradient(135deg, var(--azul2), var(--azul));
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 8px rgba(22,38,94,.25);
    transition: filter .15s ease, transform .1s ease;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: scale(.97); }
  .btn-fraco {
    background: var(--verde-fraco);
    border: 1px solid #BEE9D2;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--verde);
    white-space: nowrap;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-fraco:hover { background: #CFF1DD; }
  .btn-fraco:active { transform: scale(.97); }
  .btn-ambar {
    background: var(--ambar-fraco);
    color: var(--ambar);
    border: 1px solid #F3D9B5;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, transform .1s ease;
  }
  .btn-ambar:hover { background: #FBE3BE; }
  .btn-ambar:active { transform: scale(.97); }

  /* Conversas */
  .conversa-linha {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--borda);
    flex-wrap: wrap;
  }
  .conversa-linha:last-child { border-bottom: none; }
  .conversa-info { display: flex; flex-direction: column; gap: 2px; }
  .conversa-tel { font-size: 14px; font-weight: 700; color: var(--azul); }
  .conversa-meta { font-size: 12px; color: var(--texto-fraco); }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .status-badge.ia { background: var(--verde-fraco); color: var(--verde); }
  .status-badge.pausado { background: var(--ambar-fraco); color: var(--ambar); }
  .status-badge::before {
    content: "";
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .conversa-acao { display: flex; align-items: center; gap: 10px; }
  .conversa-item { border-bottom: 1px solid var(--borda); }
  .conversa-item:last-child { border-bottom: none; }
  .conversa-item .conversa-linha { border-bottom: none; }
  .thread-conversa {
    display: none;
    padding: 4px 0 16px;
    max-height: 340px;
    overflow-y: auto;
  }
  .thread-conversa.aberta { display: block; }
  .msg-bolha {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 8px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg-bolha.cliente {
    background: #F1F2F4;
    color: var(--texto);
    margin-right: auto;
    border-bottom-left-radius: 3px;
  }
  .msg-bolha.atendente {
    background: var(--azul-fraco);
    color: var(--azul);
    margin-left: auto;
    border-bottom-right-radius: 3px;
    text-align: right;
  }
  .caixa-envio {
    display: flex;
    gap: 8px;
    padding: 0 0 16px;
  }
  .caixa-envio input { max-width: none; flex: 1; }

  /* Agenda por município */
  .municipio-grupo {
    border-radius: 12px;
    margin-top: 14px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(16,38,94,.08);
  }
  .municipio-grupo summary {
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--azul2), var(--azul));
    color: #fff;
    transition: filter .15s ease;
  }
  .municipio-grupo summary:hover { filter: brightness(1.08); }
  .municipio-grupo summary .badge-cidade {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: rgba(255,255,255,.18);
    color: #fff;
  }
  .horario-sub { border-top: 1px solid var(--borda); background: #fff; }
  .horario-sub summary {
    padding: 10px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    background: var(--verde-fraco);
    color: #146B3E;
    transition: background .15s ease;
  }
  .horario-sub summary:hover { background: #CFF1DD; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    background: #fff;
    color: var(--verde);
    border: 1px solid #BEE9D2;
  }
  .badge.zero { background: #F3F4F6; color: var(--texto-fraco); border-color: var(--borda); }
  .lista-pessoas { list-style: none; margin: 0; padding: 10px 18px 14px; }
  .lista-pessoas li {
    padding: 7px 0;
    border-bottom: 1px solid var(--borda);
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }
  .lista-pessoas li:last-child { border-bottom: none; }
  .lista-pessoas .tel { color: var(--texto-fraco); font-size: 13px; }
  .lista-pessoas li.transferido { opacity: .55; }
  .lista-pessoas li.transferido .nome-pessoa { text-decoration: line-through; }
  .check-transferido { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .vazio-msg { padding: 12px 0 12px 18px; color: var(--texto-fraco); font-size: 13px; }

  /* Campanhas */
  .campanhas-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select#seletorPeriodo {
    border: 1px solid var(--borda);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: var(--texto);
  }
  .campanhas-aviso {
    margin: 4px 0 16px;
    padding: 14px 16px;
    border-radius: 10px;
    background: var(--ambar-fraco);
    border: 1px solid #F3D9B5;
    color: var(--ambar);
    font-size: 13px;
    line-height: 1.6;
  }
  .campanhas-aviso code {
    background: rgba(0,0,0,.06);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 12px;
  }
  .funil {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin: 8px 0 24px;
    flex-wrap: wrap;
  }
  .funil-etapa {
    flex: 1 1 160px;
    background: #fff;
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    position: relative;
  }
  .funil-etapa .rotulo { font-size: 12px; color: var(--texto-fraco); font-weight: 600; margin-bottom: 6px; }
  .funil-etapa .valor { font-size: 24px; font-weight: 800; color: var(--azul); }
  .funil-seta {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    color: var(--texto-fraco);
    font-size: 12px;
    font-weight: 700;
    min-width: 56px;
  }
  .funil-seta .pct { color: var(--verde); font-size: 14px; margin-top: 2px; }
  .grafico-wrap { padding: 8px 4px 4px; }
  .grafico-legenda {
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    padding: 0 16px 12px;
    font-size: 12px;
    color: var(--texto-fraco);
  }
  .grafico-legenda span { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .grafico-legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  table.tabela-campanhas { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tabela-campanhas th, table.tabela-campanhas td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--borda);
  }
  table.tabela-campanhas th {
    color: var(--texto-fraco);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  table.tabela-campanhas td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.tabela-campanhas tr:last-child td { border-bottom: none; }

  #login-tela {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 500px at 15% 0%, #E4EEFB 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 100%, #E1F6EC 0%, transparent 55%),
      var(--bg);
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--borda);
    border-top: 4px solid transparent;
    border-image: linear-gradient(90deg, var(--verde), var(--azul)) 1;
    border-radius: var(--raio);
    box-shadow: var(--sombra);
    padding: 32px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .login-card .logo-slot { width: 68px; height: 68px; margin: 0 auto 16px; padding: 6px; }
  .login-card .wordmark-linha1 { text-align: center; color: var(--verde); }
  .login-card .wordmark-linha2 { text-align: center; font-size: 22px; margin-bottom: 4px; color: var(--azul); }
  .login-card p:not(.wordmark-linha1):not(.wordmark-linha2) { font-size: 13px; color: var(--texto-fraco); margin: 0 0 20px; }
  .login-card input { max-width: none; margin-bottom: 12px; }
  .login-card .erro { color: #B91C1C; font-size: 13px; margin-top: 8px; min-height: 18px; }
  #bannerStatus {
    border-radius: var(--raio);
    padding: 18px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: var(--sombra);
  }
  #bannerStatus.critico { background: #FDE8E8; border: 1px solid #F5B5B5; color: #8A1F1F; }
  #bannerStatus.atencao { background: var(--ambar-fraco); border: 1px solid #F3D9B5; color: var(--ambar); }
  #bannerStatus .banner-titulo { font-weight: 800; font-size: 15px; margin-bottom: 2px; }
  #bannerStatus .banner-texto { font-size: 13px; }
  #bannerStatus img { width: 160px; height: 160px; border-radius: 10px; background: #fff; padding: 6px; }
  .status-conexao-card {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
    border-radius: 12px;
    flex-wrap: wrap;
  }
  .status-conexao-card.ok { background: var(--verde-fraco); border: 1px solid #BEE9D2; }
  .status-conexao-card.alerta { background: var(--ambar-fraco); border: 1px solid #F3D9B5; }
  .status-conexao-card.erro { background: #FDE8E8; border: 1px solid #F5B5B5; }
  .status-conexao-bolinha { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  .status-conexao-bolinha.ok { background: var(--verde); box-shadow: 0 0 0 4px var(--verde-fraco); }
  .status-conexao-bolinha.alerta { background: var(--ambar); box-shadow: 0 0 0 4px var(--ambar-fraco); }
  .status-conexao-bolinha.erro { background: #C0392B; box-shadow: 0 0 0 4px #FDE8E8; }
  .status-conexao-titulo { font-size: 16px; font-weight: 800; }
  .status-conexao-sub { font-size: 13px; color: var(--texto-fraco); margin-top: 2px; }
  .qr-conexao-wrap { text-align: center; margin-top: 20px; }
  .qr-conexao-wrap img { width: 260px; height: 260px; border-radius: 12px; border: 1px solid var(--borda); padding: 10px; background: #fff; }
  .qr-conexao-wrap p { font-size: 13px; color: var(--texto-fraco); max-width: 400px; margin: 12px auto 0; }
  .oculto { display: none !important; }
  footer { text-align: center; font-size: 12px; color: var(--texto-fraco); padding: 24px; }

  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    .wordmark-linha2 { font-size: 16px; }
    #btnSair { padding: 7px 12px; }
    main { padding: 14px; }
    .stats { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .stat-card { padding: 12px 14px; gap: 10px; }
    .stat-card .valor { font-size: 21px; }
    .stat-icone { width: 36px; height: 36px; font-size: 17px; }
    .abas {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .abas::-webkit-scrollbar { display: none; }
    .aba-btn { padding: 9px 14px; font-size: 13px; }
    .secao-header { padding: 14px 16px; }
    .secao-header > div { width: 100%; flex-direction: column; align-items: stretch; }
    .secao-body { padding: 4px 14px 14px; }
    input[type="text"], input[type="password"], select {
      max-width: none;
      font-size: 16px;
    }
    .conversa-acao { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
    .msg-bolha { max-width: 88%; }
    .lista-pessoas li { flex-direction: column; align-items: flex-start; gap: 2px; }
    .status-conexao-card { flex-direction: column; align-items: center; text-align: center; }
    #btnGerarQR { margin-left: 0 !important; margin-top: 8px; }
    #bannerStatus { flex-direction: column; text-align: center; }
    .qr-conexao-wrap img { width: 100%; max-width: 260px; height: auto; }
    .modal-box { padding: 18px; }
    .funil-etapa { flex: 1 1 100%; }
    .funil-seta { flex-direction: row; min-width: 0; padding: 4px 0; }
  }
</style>
</head>
<body>

<div id="login-tela">
  <div class="login-card">
    <div class="logo-slot"></div>
    <p class="wordmark-linha1">PROJETO</p>
    <p class="wordmark-linha2">VISÃO CIDADÃO</p>
    <p>Painel da equipe — digite a chave de acesso</p>
    <input type="password" id="inputChave" placeholder="Chave de acesso" />
    <button class="btn" style="width:100%" id="btnEntrar">Entrar</button>
    <div class="erro" id="loginErro"></div>
  </div>
</div>

<div id="painel" class="oculto">
  <header>
    <div class="marca">
      <div class="logo-slot"></div>
      <div>
        <p class="wordmark-linha1">PROJETO</p>
        <p class="wordmark-linha2">VISÃO CIDADÃO</p>
      </div>
    </div>

<script>
const LOGO_SVG = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="#1E9E5B">
    ${Array.from({ length: 24 }, (_, i) => `<rect x="47" y="4" width="6" height="16" rx="3" transform="rotate(${i * 15} 50 50)"/>`).join("")}
  </g>
  <circle cx="50" cy="50" r="19" fill="#16265E"/>
  <circle cx="44" cy="43" r="5.5" fill="#FFFFFF"/>
</svg>`;
document.querySelectorAll(".logo-slot").forEach((el) => (el.innerHTML = LOGO_SVG));

function escaparHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const LS_CHAVE = "visao_cidadao_chave";
let dadosAtuais = null;
let abaAtiva = "conversas";

function elLogin() { return document.getElementById("login-tela"); }
function elPainel() { return document.getElementById("painel"); }

async function buscarDados(chave) {
  const resp = await fetch("/api/dados?chave=" + encodeURIComponent(chave));
  if (!resp.ok) throw new Error("chave-invalida");
  return resp.json();
}

function tempoRelativo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diffMs / 60000);
  if (min < 1) return "agora mesmo";
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `há ${h}h`;
  const d = Math.floor(h / 24);
  return `há ${d} dia${d === 1 ? "" : "s"}`;
}

function renderizar(dados) {
  dadosAtuais = dados;
  atualizarBannerStatus(dados);

  const totalAgendamentos = dados.agendamentos.length;
  const totalConversas = dados.conversas.length;
  const totalPausados = dados.conversas.filter((c) => c.pausado).length;
  const totalMunicipios = dados.cidades.length;

  const cards = [
    { icone: "💬", valor: totalConversas, rotulo: "Pessoas conversando", cor: "var(--azul)", corFraca: "var(--azul-fraco)" },
    { icone: "⏸️", valor: totalPausados, rotulo: "Aguardando atendimento humano", cor: "var(--ambar)", corFraca: "var(--ambar-fraco)" },
    { icone: "📅", valor: totalAgendamentos, rotulo: "Agendamentos totais", cor: "var(--verde)", corFraca: "var(--verde-fraco)" },
    { icone: "📍", valor: totalMunicipios, rotulo: "Municípios no cronograma", cor: "var(--teal)", corFraca: "var(--teal-fraco)" },
  ];

  document.getElementById("stats").innerHTML = cards
    .map(
      (c) => `
    <div class="stat-card" style="--cor-tema:${c.cor}; --cor-fraca:${c.corFraca};">
      <div class="stat-icone">${c.icone}</div>
      <div>
        <div class="valor">${c.valor}</div>
        <div class="rotulo">${c.rotulo}</div>
      </div>
    </div>`
    )
    .join("");

  renderizarConversas();
  renderizarAgenda();
  if (abaAtiva === "conexao") renderizarConexao(dados);
}

let ultimoQR = null;

async function atualizarBannerStatus(dados) {
  const banner = document.getElementById("bannerStatus");
  const status = dados.statusConexao;

  if (status === "conectado") {
    banner.classList.add("oculto");
    ultimoQR = null;
    return;
  }

  banner.classList.remove("oculto");

  if (status === "aguardando_qr" && dados.temQR) {
    banner.className = "atencao";
    banner.innerHTML = `
      <div>
        <div class="banner-titulo">📱 WhatsApp desconectado — escaneie pra reconectar</div>
        <div class="banner-texto">Abra o WhatsApp no celular do número do bot → Aparelhos conectados → Conectar aparelho → aponte a câmera pro código ao lado.</div>
      </div>
      <img id="imgQR" src="" alt="QR code" />
    `;
    try {
      const chave = localStorage.getItem(LS_CHAVE);
      const resp = await fetch(`/api/qr?chave=${encodeURIComponent(chave)}`);
      if (resp.ok) {
        const dadosQR = await resp.json();
        const img = document.getElementById("imgQR");
        if (img) img.src = dadosQR.imagem;
      }
    } catch (e) {}
    return;
  }

  banner.className = "critico";
  banner.innerHTML = `
    <div>
      <div class="banner-titulo">⚠️ WhatsApp desconectado</div>
      <div class="banner-texto">O bot não está respondendo no momento. Aguardando reconexão automática...</div>
    </div>
  `;
}

function formatarTelefone(numero) {
  if (!numero) return null;
  const d = numero.replace(/\D/g, "");
  if (d.startsWith("55") && d.length === 13) {
    return `+55 ${d.slice(2, 4)} ${d.slice(4, 9)}-${d.slice(9)}`;
  }
  return `+${d} (número pode estar incompleto)`;
}

const threadsAbertas = new Set();

function renderizarConversas() {
  const dados = dadosAtuais;
  if (!dados) return;
  const termo = document.getElementById("buscaConversas").value.trim().toLowerCase();

  const lista = dados.conversas.filter((c) => {
    if (!termo) return true;
    return c.telefone.toLowerCase().includes(termo) || (c.numeroReal || "").toLowerCase().includes(termo);
  });

  if (lista.length === 0) {
    document.getElementById("listaConversas").innerHTML = `<div class="vazio-msg">Ninguém conversou com o bot ainda.</div>`;
    return;
  }

  const idSeguro = (t) => t.replace(/[^a-zA-Z0-9]/g, "_");

  document.getElementById("listaConversas").innerHTML = lista
    .map((c) => {
      const numeroExibido = formatarTelefone(c.numeroReal) || c.telefone;
      const aberta = threadsAbertas.has(c.telefone);
      return `
      <div class="conversa-item">
        <div class="conversa-linha">
          <div class="conversa-info">
            <span class="conversa-tel">${numeroExibido}</span>
            <span class="conversa-meta">Última mensagem ${tempoRelativo(c.ultimaMensagem)}</span>
          </div>
          <div class="conversa-acao">
            <span class="status-badge ${c.pausado ? "pausado" : "ia"}">${c.pausado ? "Atendimento humano" : "IA respondendo"}</span>
            <button class="btn-fraco" onclick="alternarConversa('${c.telefone}')">${aberta ? "Ocultar" : "Ver conversa"}</button>
            ${
              c.pausado
                ? `<button class="btn-fraco" onclick="retomarIA('${c.telefone}')">Retomar IA</button>`
                : `<button class="btn-ambar" onclick="pausarIA('${c.telefone}')">Pausar IA</button>`
            }
          </div>
        </div>
        <div class="thread-conversa ${aberta ? "aberta" : ""}" id="thread-${idSeguro(c.telefone)}"></div>
        ${
          aberta
            ? `<div class="caixa-envio">
                <input type="text" id="envio-${idSeguro(c.telefone)}" placeholder="Digite uma mensagem..." onkeydown="if(event.key==='Enter')enviarMensagem('${c.telefone}')" />
                <button class="btn" onclick="enviarMensagem('${c.telefone}')">Enviar</button>
              </div>`
            : ""
        }
      </div>
    `;
    })
    .join("");

  for (const tel of threadsAbertas) {
    if (lista.some((c) => c.telefone === tel)) carregarThread(tel);
  }
}

async function enviarMensagem(telefone) {
  const idSeguro = telefone.replace(/[^a-zA-Z0-9]/g, "_");
  const input = document.getElementById("envio-" + idSeguro);
  const texto = input.value.trim();
  if (!texto) return;
  const chave = localStorage.getItem(LS_CHAVE);
  input.disabled = true;
  try {
    await fetch("/api/enviar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chave, jid: telefone, texto }),
    });
    input.value = "";
    await carregarThread(telefone);
    atualizar();
  } finally {
    input.disabled = false;
    input.focus();
  }
}

async function alternarConversa(telefone) {
  if (threadsAbertas.has(telefone)) {
    threadsAbertas.delete(telefone);
  } else {
    threadsAbertas.add(telefone);
  }
  renderizarConversas();
}

async function carregarThread(telefone) {
  const chave = localStorage.getItem(LS_CHAVE);
  const el = document.getElementById("thread-" + telefone.replace(/[^a-zA-Z0-9]/g, "_"));
  if (!el) return;
  try {
    const resp = await fetch(`/api/conversa?jid=${encodeURIComponent(telefone)}&chave=${encodeURIComponent(chave)}`);
    const dados = await resp.json();
    const mensagens = dados.mensagens || [];
    el.innerHTML = mensagens.length
      ? mensagens.map((m) => `<div class="msg-bolha ${m.role === "cliente" ? "cliente" : "atendente"}">${escaparHtml(m.text)}</div>`).join("")
      : `<div class="vazio-msg">Sem mensagens registradas ainda.</div>`;
    el.scrollTop = el.scrollHeight;
  } catch (e) {
    el.innerHTML = `<div class="vazio-msg">Erro ao carregar conversa.</div>`;
  }
}

function linhaAgendamento(p, comHorario) {
  const rotulo = comHorario ? `${escaparHtml(p.nome)} — ${escaparHtml(p.horario)}` : escaparHtml(p.nome);
  return `
    <li class="${p.transferido ? "transferido" : ""}">
      <label class="check-transferido">
        <input type="checkbox" ${p.transferido ? "checked" : ""} onchange="marcarTransferido('${p.criadoEm}', this.checked)" />
        <span class="nome-pessoa">${rotulo}</span>
      </label>
      <span class="tel">${escaparHtml(p.telefone)}</span>
    </li>
  `;
}

async function marcarTransferido(criadoEm, transferido) {
  const chave = localStorage.getItem(LS_CHAVE);
  try {
    await fetch("/api/agendamento-transferido", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chave, criadoEm, transferido }),
    });
    atualizar();
  } catch (e) {}
}

function extrairCidadeCliente(horario) {
  const m = (horario || "").match(/\b(?:em|no|na)\s+(.+?)\s+às\s+\d{2}:\d{2}/i);
  return m ? m[1] : null;
}

const estadoDetalhesAgenda = new Map();

function capturarEstadoAgenda() {
  document.querySelectorAll("#listaAgenda details[data-key]").forEach((el) => {
    estadoDetalhesAgenda.set(el.dataset.key, el.open);
  });
}

function estaAberto(key, padrao) {
  return estadoDetalhesAgenda.has(key) ? estadoDetalhesAgenda.get(key) : padrao;
}

function renderizarAgenda() {
  const dados = dadosAtuais;
  if (!dados) return;
  capturarEstadoAgenda();
  const termo = document.getElementById("buscaAgenda").value.trim().toLowerCase();

  const porHorario = new Map();
  for (const h of dados.horarios) porHorario.set(h, []);
  const outros = [];
  for (const ag of dados.agendamentos) {
    if (porHorario.has(ag.horario)) porHorario.get(ag.horario).push(ag);
    else outros.push(ag);
  }

  const cidadesConhecidas = new Set(dados.cidades.map((g) => g.cidade));
  const outrosPorCidade = new Map();
  const outrosSemCidade = [];
  for (const ag of outros) {
    const cidade = extrairCidadeCliente(ag.horario);
    if (cidade && cidadesConhecidas.has(cidade)) {
      if (!outrosPorCidade.has(cidade)) outrosPorCidade.set(cidade, []);
      outrosPorCidade.get(cidade).push(ag);
    } else {
      outrosSemCidade.push(ag);
    }
  }

  function bate(pessoas, horario) {
    if (!termo) return true;
    if (horario.toLowerCase().includes(termo)) return true;
    return pessoas.some(
      (p) => (p.nome || "").toLowerCase().includes(termo) || (p.telefone || "").toLowerCase().includes(termo)
    );
  }

  function bateLista(pessoas) {
    if (!termo) return pessoas;
    return pessoas.filter(
      (p) =>
        (p.nome || "").toLowerCase().includes(termo) ||
        (p.telefone || "").toLowerCase().includes(termo) ||
        (p.horario || "").toLowerCase().includes(termo)
    );
  }

  let html = "";
  for (const grupo of dados.cidades) {
    const linhasHorario = grupo.horarios
      .filter((h) => bate(porHorario.get(h) || [], h))
      .map((h) => {
        const pessoas = porHorario.get(h) || [];
        const chaveHorario = `horario:${h}`;
        return `
          <details class="horario-sub" data-key="${chaveHorario}" ${estaAberto(chaveHorario, pessoas.length > 0) ? "open" : ""}>
            <summary>
              <span>${h}</span>
              <span class="badge ${pessoas.length === 0 ? "zero" : ""}">${pessoas.length} agendado${pessoas.length === 1 ? "" : "s"}</span>
            </summary>
            ${
              pessoas.length === 0
                ? `<div class="vazio-msg">Nenhum agendamento ainda.</div>`
                : `<ul class="lista-pessoas">${pessoas.map((p) => linhaAgendamento(p, false)).join("")}</ul>`
            }
          </details>
        `;
      })
      .join("");

    if (!linhasHorario) continue;

    const totalCidade = grupo.horarios.reduce((soma, h) => soma + (porHorario.get(h) || []).length, 0);

    const chaveCidade = `cidade:${grupo.cidade}`;
    html += `
      <details class="municipio-grupo" data-key="${chaveCidade}" ${estaAberto(chaveCidade, true) ? "open" : ""}>
        <summary>
          <span>📍 ${grupo.cidade}</span>
          <span class="badge-cidade">${totalCidade} agendado${totalCidade === 1 ? "" : "s"}</span>
        </summary>
        ${linhasHorario}
      </details>
    `;
  }

  for (const grupo of dados.cidades) {
    const foraDoPadrao = bateLista(outrosPorCidade.get(grupo.cidade) || []);
    if (foraDoPadrao.length === 0) continue;
    const chaveFora = `fora:${grupo.cidade}`;
    html += `
      <details class="municipio-grupo" data-key="${chaveFora}" ${estaAberto(chaveFora, true) ? "open" : ""}>
        <summary>
          <span>⏱️ Fora do padrão — ${grupo.cidade}</span>
          <span class="badge-cidade">${foraDoPadrao.length} agendado${foraDoPadrao.length === 1 ? "" : "s"}</span>
        </summary>
        <ul class="lista-pessoas">${foraDoPadrao.map((p) => linhaAgendamento(p, true)).join("")}</ul>
      </details>
    `;
  }

  const semCidadeFiltrado = bateLista(outrosSemCidade);
  if (semCidadeFiltrado.length > 0) {
    html += `
      <details class="municipio-grupo" data-key="sem-cidade" ${estaAberto("sem-cidade", true) ? "open" : ""}>
        <summary><span>Outros horários (cidade não identificada)</span><span class="badge-cidade">${semCidadeFiltrado.length}</span></summary>
        <ul class="lista-pessoas">${semCidadeFiltrado.map((p) => linhaAgendamento(p, true)).join("")}</ul>
      </details>
    `;
  }

  document.getElementById("listaAgenda").innerHTML = html || `<div class="vazio-msg">Nada encontrado.</div>`;
}

function abrirModalAgendamento() {
  if (!dadosAtuais) return;
  const select = document.getElementById("inputHorarioAgendamento");
  select.innerHTML = dadosAtuais.horarios.map((h) => `<option value="${h}">${h}</option>`).join("");
  document.getElementById("inputNomeAgendamento").value = "";
  document.getElementById("inputTelefoneAgendamento").value = "";
  document.getElementById("modalAgendamento").classList.remove("oculto");
}

function fecharModalAgendamento() {
  document.getElementById("modalAgendamento").classList.add("oculto");
}

async function salvarAgendamentoManual() {
  const nome = document.getElementById("inputNomeAgendamento").value.trim();
  const telefone = document.getElementById("inputTelefoneAgendamento").value.trim();
  const horario = document.getElementById("inputHorarioAgendamento").value;
  if (!nome) {
    alert("Informe o nome da pessoa.");
    return;
  }
  const chave = localStorage.getItem(LS_CHAVE);
  try {
    const resp = await fetch("/api/agendamento-manual", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chave, nome, telefone, horario }),
    });
    const d = await resp.json();
    if (!resp.ok) {
      alert(d.erro || "Não foi possível salvar o agendamento.");
      return;
    }
    fecharModalAgendamento();
    atualizar();
  } catch (e) {
    alert("Erro ao salvar agendamento.");
  }
}

async function retomarIA(telefone) {
  const chave = localStorage.getItem(LS_CHAVE);
  await fetch("/api/retomar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chave, telefone }),
  });
  atualizar();
}

async function retomarTodasIA() {
  if (!confirm("Retomar a IA em TODAS as conversas pausadas?")) return;
  const chave = localStorage.getItem(LS_CHAVE);
  const resp = await fetch("/api/retomar-todos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chave }),
  });
  const d = await resp.json();
  if (resp.ok) alert(`IA retomada em ${d.retomados} conversa${d.retomados === 1 ? "" : "s"}.`);
  atualizar();
}

async function pausarIA(telefone) {
  const chave = localStorage.getItem(LS_CHAVE);
  await fetch("/api/pausar", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chave, telefone }),
  });
  atualizar();
}

function partesDoHorario(h) {
  const texto = h || "";
  const mHora = texto.match(/às\s+(\d{2}:\d{2})/i);
  const hora = mHora ? mHora[1] : "";
  const mDia = texto.match(/^(.*?)\s+(?:em|no|na)\s+.+?\s+às\s+\d{2}:\d{2}/i);
  const dia = mDia ? mDia[1] : texto.replace(/\s+às\s+\d{2}:\d{2}.*$/i, "");
  return { dia, hora };
}

function gerarCSVDeAgendamentos(agendamentos) {
  const cidadePorHorario = new Map();
  const ordemHorario = new Map();
  let ordem = 0;
  for (const grupo of dadosAtuais.cidades) {
    for (const h of grupo.horarios) {
      cidadePorHorario.set(h, grupo.cidade);
      ordemHorario.set(h, ordem++);
    }
  }
  const ordemCidade = new Map(dadosAtuais.cidades.map((g, i) => [g.cidade, i]));

  const porCidade = new Map();
  for (const a of agendamentos) {
    const cidade = cidadePorHorario.get(a.horario) || "Outros horários (fora da lista padrão)";
    if (!porCidade.has(cidade)) porCidade.set(cidade, []);
    porCidade.get(cidade).push(a);
  }

  const cidadesOrdenadas = [...porCidade.keys()].sort(
    (a, b) => (ordemCidade.has(a) ? ordemCidade.get(a) : Infinity) - (ordemCidade.has(b) ? ordemCidade.get(b) : Infinity)
  );

  const linhas = [["cidade", "nome", "telefone", "dia", "horario"]];
  for (const cidade of cidadesOrdenadas) {
    const lista = porCidade.get(cidade).slice().sort((x, y) => {
      const ox = ordemHorario.has(x.horario) ? ordemHorario.get(x.horario) : Infinity;
      const oy = ordemHorario.has(y.horario) ? ordemHorario.get(y.horario) : Infinity;
      if (ox !== oy) return ox - oy;
      return (x.criadoEm || "").localeCompare(y.criadoEm || "");
    });
    for (const a of lista) {
      const { dia, hora } = partesDoHorario(a.horario);
      linhas.push([cidade, a.nome, a.telefone, dia, hora]);
    }
  }
  return linhas.map((l) => l.map((v) => `"${String(v || "").replace(/"/g, '""')}"`).join(",")).join("\n");
}

function baixarCSVString(csv, nomeArquivo) {
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo;
  a.click();
  URL.revokeObjectURL(url);
}

function exportarCSV() {
  if (!dadosAtuais) return;
  baixarCSVString(gerarCSVDeAgendamentos(dadosAtuais.agendamentos), "agendamentos_visao_cidadao.csv");
}

function trocarAba(aba) {
  abaAtiva = aba;
  document.querySelectorAll(".aba-btn").forEach((b) => b.classList.toggle("ativa", b.dataset.aba === aba));
  document.getElementById("painelConversas").classList.toggle("oculto", aba !== "conversas");
  document.getElementById("painelAgenda").classList.toggle("oculto", aba !== "agenda");
  document.getElementById("painelCampanhas").classList.toggle("oculto", aba !== "campanhas");
  document.getElementById("painelConexao").classList.toggle("oculto", aba !== "conexao");
  if (aba === "campanhas" && !campanhasCarregadas) buscarCampanhas();
  if (aba === "conexao" && dadosAtuais) renderizarConexao(dadosAtuais);
  if (aba !== "conexao" && intervaloQR) {
    clearInterval(intervaloQR);
    intervaloQR = null;
  }
}

async function renderizarConexao(dados) {
  const corpo = document.getElementById("corpoConexao");
  const status = dados.statusConexao;

  const infoStatus = {
    conectado: { classe: "ok", titulo: "✅ Conectado", sub: dados.conectadoDesde ? `Conectado desde ${new Date(dados.conectadoDesde).toLocaleString("pt-BR")}` : "" },
    aguardando_qr: { classe: "alerta", titulo: "📱 Aguardando pareamento", sub: "Escaneie o QR code abaixo pra conectar" },
    reconectando: { classe: "alerta", titulo: "🔄 Reconectando...", sub: "O bot está tentando se reconectar automaticamente" },
    conectando: { classe: "alerta", titulo: "⏳ Iniciando...", sub: "Aguarde, o bot está subindo" },
    desconectado: { classe: "erro", titulo: "⚠️ Desconectado", sub: "A sessão caiu e precisa de um pareamento novo" },
  };
  const info = infoStatus[status] || infoStatus.desconectado;

  corpo.innerHTML = `
    <div class="status-conexao-card ${info.classe}">
      <div class="status-conexao-bolinha ${info.classe}"></div>
      <div>
        <div class="status-conexao-titulo">${info.titulo}</div>
        <div class="status-conexao-sub">${info.sub}</div>
        ${dados.numeroBot ? `<div class="status-conexao-sub">Número: +${dados.numeroBot}</div>` : ""}
      </div>
      ${status !== "conectado" ? `<button id="btnGerarQR" class="btn" style="margin-left:auto" onclick="gerarNovoQR()">🔄 Gerar novo QR Code</button>` : ""}
    </div>
    <div id="areaQRConexao"></div>
  `;

  if (dados.temQR) {
    const area = document.getElementById("areaQRConexao");
    area.innerHTML = `<div class="qr-conexao-wrap"><img id="imgQRConexao" src="" alt="QR code" /><p>Abra o WhatsApp no celular do número do bot → Aparelhos conectados → Conectar aparelho → aponte a câmera pra este código. Ele se renova sozinho a cada poucos segundos, então pode escanear assim que a tela abrir.</p></div>`;
    await atualizarSoQR();
    if (!intervaloQR) intervaloQR = setInterval(atualizarSoQR, 4000);
  } else if (intervaloQR) {
    clearInterval(intervaloQR);
    intervaloQR = null;
  }
}

let intervaloQR = null;

async function atualizarSoQR() {
  const chave = localStorage.getItem(LS_CHAVE);
  try {
    const resp = await fetch(`/api/qr?chave=${encodeURIComponent(chave)}`);
    if (!resp.ok) {
      clearInterval(intervaloQR);
      intervaloQR = null;
      return;
    }
    const dadosQR = await resp.json();
    const img = document.getElementById("imgQRConexao");
    if (img) img.src = dadosQR.imagem;
  } catch (e) {}
}

async function gerarNovoQR() {
  const btn = document.getElementById("btnGerarQR");
  if (btn) {
    btn.disabled = true;
    btn.textContent = "Gerando...";
  }
  try {
    const chave = localStorage.getItem(LS_CHAVE);
    const resp = await fetch(`/api/reconectar?chave=${encodeURIComponent(chave)}`, { method: "POST" });
    const d = await resp.json();
    if (!resp.ok) alert(d.erro || "Não foi possível gerar o QR code agora.");
  } catch (e) {
    alert("Erro ao gerar QR code. Tente de novo em alguns segundos.");
  }
  setTimeout(atualizar, 1500);
}

const CORES = { cliques: "#1E4FA0", mensagens: "#B45309", agendamentos: "#1E9E5B" };
let campanhasCarregadas = false;
let graficoCampanhas = null;

function formatarMoeda(v) {
  return (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function formatarNumero(v) {
  return (v || 0).toLocaleString("pt-BR");
}

function formatarDataCurta(iso) {
  const [, m, d] = iso.split("-");
  return `${d}/${m}`;
}

async function buscarCampanhas() {
  const corpo = document.getElementById("corpoCampanhas");
  const dias = document.getElementById("seletorPeriodo").value;
  const chave = localStorage.getItem(LS_CHAVE);
  corpo.innerHTML = `<div class="vazio-msg">Carregando dados da campanha...</div>`;

  try {
    const resp = await fetch(`/api/campanhas?chave=${encodeURIComponent(chave)}&dias=${dias}`);
    const dados = await resp.json();

    if (!resp.ok) {
      corpo.innerHTML = `<div class="campanhas-aviso">
        <strong>Integração com Meta Ads ainda não configurada.</strong><br>
        ${dados.erro || "Erro desconhecido."}<br><br>
        Defina <code>FB_ACCESS_TOKEN</code> e <code>FB_AD_ACCOUNT_ID</code> no <code>.env</code> do bot e reinicie o processo.
      </div>`;
      return;
    }

    campanhasCarregadas = true;
    renderizarCampanhas(dados);
  } catch (e) {
    corpo.innerHTML = `<div class="campanhas-aviso">Falha ao buscar dados da campanha: ${e.message}</div>`;
  }
}

function renderizarCampanhas(dados) {
  const corpo = document.getElementById("corpoCampanhas");
  const { resumo, funil, porDia, porCampanha } = dados;

  const custoPorClique = resumo.cliques ? resumo.gasto / resumo.cliques : 0;
  const custoPorMensagem = resumo.mensagens ? resumo.gasto / resumo.mensagens : 0;
  const custoPorAgendamento = funil.agendamentos ? resumo.gasto / funil.agendamentos : 0;

  const cardsHtml = [
    { rotulo: "Investimento no período", valor: formatarMoeda(resumo.gasto), cor: "var(--azul)" },
    { rotulo: "Cliques no anúncio", valor: formatarNumero(resumo.cliques), cor: "var(--azul)" },
    { rotulo: "Custo por clique", valor: formatarMoeda(custoPorClique), cor: "var(--azul)" },
    { rotulo: "Mensagens iniciadas (Meta)", valor: formatarNumero(resumo.mensagens), cor: "var(--ambar)" },
    { rotulo: "Custo por mensagem", valor: formatarMoeda(custoPorMensagem), cor: "var(--ambar)" },
    { rotulo: "Agendamentos confirmados", valor: formatarNumero(funil.agendamentos), cor: "var(--verde)" },
    { rotulo: "Custo por agendamento", valor: formatarMoeda(custoPorAgendamento), cor: "var(--verde)" },
  ]
    .map(
      (c) => `
      <div class="stat-card" style="--cor-tema:${c.cor};">
        <div>
          <div class="valor">${c.valor}</div>
          <div class="rotulo">${c.rotulo}</div>
        </div>
      </div>`
    )
    .join("");

  function etapaFunil(rotulo, valor) {
    return `<div class="funil-etapa"><div class="rotulo">${rotulo}</div><div class="valor">${formatarNumero(valor)}</div></div>`;
  }
  function setaFunil(de, para) {
    const pct = de ? Math.round((para / de) * 100) : 0;
    return `<div class="funil-seta">→<span class="pct">${pct}%</span></div>`;
  }

  const funilHtml = `
    <div class="funil">
      ${etapaFunil("Cliques no anúncio", funil.cliques)}
      ${setaFunil(funil.cliques, funil.mensagensMeta)}
      ${etapaFunil("Mensagens iniciadas (Meta)", funil.mensagensMeta)}
      ${setaFunil(funil.mensagensMeta, funil.conversasBot)}
      ${etapaFunil("Conversas recebidas no bot", funil.conversasBot)}
      ${setaFunil(funil.conversasBot, funil.agendamentos)}
      ${etapaFunil("Agendamentos confirmados", funil.agendamentos)}
    </div>
  `;

  const linhasTabela = porCampanha
    .map(
      (c) => `
      <tr>
        <td>${c.campanha}</td>
        <td class="num">${formatarNumero(c.cliques)}</td>
        <td class="num">${formatarNumero(c.mensagens)}</td>
        <td class="num">${formatarMoeda(c.gasto)}</td>
        <td class="num">${formatarMoeda(c.cliques ? c.gasto / c.cliques : 0)}</td>
      </tr>`
    )
    .join("");

  corpo.innerHTML = `
    <div class="stats" style="margin-top:8px;">${cardsHtml}</div>
    ${funilHtml}
    <div class="secao" style="box-shadow:none; border:1px solid var(--borda);">
      <div class="grafico-legenda">
        <span><i style="background:${CORES.cliques}"></i>Cliques</span>
        <span><i style="background:${CORES.mensagens}"></i>Mensagens iniciadas</span>
        <span><i style="background:${CORES.agendamentos}"></i>Agendamentos</span>
      </div>
      <div class="grafico-wrap"><canvas id="graficoCampanhas" height="90"></canvas></div>
    </div>
    <div class="secao" style="box-shadow:none; border:1px solid var(--borda); margin-top:20px;">
      <div class="secao-header"><h2>Por campanha</h2></div>
      <div class="secao-body" style="overflow-x:auto;">
        <table class="tabela-campanhas">
          <thead><tr><th>Campanha</th><th class="num">Cliques</th><th class="num">Mensagens</th><th class="num">Gasto</th><th class="num">Custo/clique</th></tr></thead>
          <tbody>${linhasTabela || `<tr><td colspan="5" class="vazio-msg">Sem campanhas no período.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;

  desenharGraficoCampanhas(porDia);
}

function desenharGraficoCampanhas(porDia) {
  const ctx = document.getElementById("graficoCampanhas");
  if (!ctx || typeof Chart === "undefined") return;
  if (graficoCampanhas) graficoCampanhas.destroy();

  graficoCampanhas = new Chart(ctx, {
    type: "line",
    data: {
      labels: porDia.map((d) => formatarDataCurta(d.dia)),
      datasets: [
        {
          label: "Cliques",
          data: porDia.map((d) => d.cliques),
          borderColor: CORES.cliques,
          backgroundColor: CORES.cliques,
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.25,
        },
        {
          label: "Mensagens iniciadas",
          data: porDia.map((d) => d.mensagens),
          borderColor: CORES.mensagens,
          backgroundColor: CORES.mensagens,
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.25,
        },
        {
          label: "Agendamentos",
          data: porDia.map((d) => d.agendamentos),
          borderColor: CORES.agendamentos,
          backgroundColor: CORES.agendamentos,
          borderWidth: 2,
          pointRadius: 3,
          tension: 0.25,
        },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: "index", intersect: false },
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: "#F0F2F6" } },
        x: { grid: { display: false } },
      },
    },
  });
}

async function atualizar() {
  const chave = localStorage.getItem(LS_CHAVE);
  if (!chave) return mostrarLogin();
  try {
    const dados = await buscarDados(chave);
    renderizar(dados);
    elLogin().classList.add("oculto");
    elPainel().classList.remove("oculto");
  } catch (e) {
    mostrarLogin();
  }
}

function mostrarLogin() {
  elPainel().classList.add("oculto");
  elLogin().classList.remove("oculto");
}

document.getElementById("btnEntrar").addEventListener("click", async () => {
  const chave = document.getElementById("inputChave").value.trim();
  const erroEl = document.getElementById("loginErro");
  erroEl.textContent = "";
  try {
    const dados = await buscarDados(chave);
    localStorage.setItem(LS_CHAVE, chave);
    renderizar(dados);
    elLogin().classList.add("oculto");
    elPainel().classList.remove("oculto");
  } catch (e) {
    erroEl.textContent = "Chave inválida.";
  }
});

document.getElementById("inputChave").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("btnEntrar").click();
});

document.getElementById("btnSair").addEventListener("click", () => {
  localStorage.removeItem(LS_CHAVE);
  mostrarLogin();
});

document.querySelectorAll(".aba-btn").forEach((b) => b.addEventListener("click", () => trocarAba(b.dataset.aba)));
document.getElementById("buscaConversas").addEventListener("input", renderizarConversas);
document.getElementById("buscaAgenda").addEventListener("input", renderizarAgenda);
document.getElementById("btnExportar").addEventListener("click", exportarCSV);
document.getElementById("btnAtualizarCampanhas").addEventListener("click", buscarCampanhas);
document.getElementById("seletorPeriodo").addEventListener("change", buscarCampanhas);

atualizar();
setInterval(atualizar, 20000);
</script>
